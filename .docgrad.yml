# .docgrad.yml — docgrad configuration (version-controlled, shared by the team)
# This repo is an Agent Skill:
#   entry = skills/docgrad/SKILL.md (the only file auto-loaded when the skill triggers; README.md is
#           the human-facing GitHub landing page, not loaded into agent context, so it is not
#           listed as an entry_file — listing it would inflate the fixed cost by 1,807 tokens)
#   index = README.md (the human navigation entry point, the starting point for linkage reachability)
#
# v1.7.0 moved the skill payload to skills/docgrad/ (#47). corpus_hash therefore breaks once here,
# on purpose: this repo's round-over-round trend has a real discontinuity at that release, and a
# hash that did *not* move would be the bug. See CHANGELOG.md 1.7.0.
docs_dirs: [docs/, skills/docgrad/reference/]
# CONTRIBUTING.md / INTEROP.md are real documentation and are graded, but neither is loaded on
# every task, so they go in docs_files rather than entry_files (see reference/init.md item 3).
# corpus_hash moves once here, on purpose: the corpus genuinely grew by two files.
docs_files: [CONTRIBUTING.md, INTEROP.md]
entry_files: [skills/docgrad/SKILL.md]
index_file: README.md
src_dirs: [skills/docgrad/scripts/]
scenarios: [skills/docgrad/scripts/links.mjs, skills/docgrad/scripts/lib.mjs]
exclude: []
freshness:
  convention: heading-line
  field: "Last updated:"
targets:
#   entry_cost: WATCH
correctness_sample: 8
scenario: "add a new scoring dimension to docgrad"
language: en
